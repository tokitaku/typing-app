services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: >-
      /bin/sh -c 'export NEXT_PUBLIC_API_BASE_URL="$${NEXT_PUBLIC_API_BASE_URL:-http://localhost:$${BACKEND_PORT:-8000}}";
      npm run dev'
    working_dir: /app/frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: >-
      /bin/sh -c 'export BACKEND_CORS_ORIGINS="$${BACKEND_CORS_ORIGINS:-http://localhost:$${FRONTEND_PORT:-3000}}";
      uv run --project backend uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000 --app-dir /app'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      DATABASE_URL: postgresql://typing_app:typing_app_password@postgres:5432/typing_app
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      timeout: 5s
      interval: 5s
      retries: 12
      start_period: 5s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: typing_app
      POSTGRES_PASSWORD: typing_app_password
      POSTGRES_DB: typing_app
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typing_app"]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
